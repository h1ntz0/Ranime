# nginx reverse proxy for AnimeRate.
# Routes: /api and /uploads -> Fastify (4000), everything else -> Vite dev server (3000).
# Phone/other devices reach this via http://<LAN-IP> on port 80.
server {
  listen 80;
  server_name _;

  # avatars / uploads can exceed 1MB
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /uploads/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
