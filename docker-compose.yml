services:
  postgres:
    image: postgres:16-alpine
    container_name: animelist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: anime
      POSTGRES_DB: animelist
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anime -d animelist']
      interval: 5s
      timeout: 5s
      retries: 10

  # Reverse proxy so your phone can reach the app via http://<LAN-IP>
  nginx:
    image: nginx:alpine
    container_name: animelist-nginx
    restart: unless-stopped
    network_mode: host # lets nginx reach dev servers on 127.0.0.1
    depends_on:
      - postgres
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
