services:
  postgres:
    image: postgres:16-alpine
    container_name: animelist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: anime
      POSTGRES_DB: animelist
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anime -d animelist']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
